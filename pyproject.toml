[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-tutor"
version = "0.3.3"
description = "A teaching assistant for Jupyter notebooks that runs on the student's own computer"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Charlie Abela", email = "charlie.abela@um.edu.mt" }]
keywords = ["education", "jupyter", "notebook", "tutor", "data science", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Jupyter",
  "Intended Audience :: Education",
  "Topic :: Education",
]
dependencies = [
  "jupyter_client>=8.0",
  "ipykernel>=6.25",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "scikit-learn>=1.3",
  "networkx>=3.2",
  "openpyxl>=3.1",
  "requests>=2.31",       # notebooks that download data (APIs such as Europe PMC and Open-Meteo)
  "beautifulsoup4>=4.11", # notebooks that read web pages (the web-data topic)
  "nltk>=3.8",            # stemming in the text-to-graphs topic
  "neo4j>=5.14",          # the Neo4j driver: setup checks and graph-database topics
  "pip>=24",              # so that %pip install works inside notebooks, as in Jupyter and Colab
  "ai-learning-kit @ git+https://github.com/charlieabela/ai-learning-kit@v1.2.0",   # the public repository; releases are published there from the development repository
]

[project.optional-dependencies]
# Topics on dense retrieval, embeddings, transformers, graph neural networks and knowledge graphs.
advanced = [
    # PyTorch stopped building for Intel Macs after 2.2. There, PyTorch 2.2 needs NumPy 1, transformers 5 switches
    # PyTorch off (it wants 2.6), and sentence-transformers 6 needs transformers 5; so Intel Macs get the last
    # versions that work together, and every other computer the current ones.
    "torch>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'", "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2; sys_platform != 'darwin' or platform_machine != 'x86_64'", "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=5; sys_platform != 'darwin' or platform_machine != 'x86_64'", "transformers>=4.41,<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=6; sys_platform != 'darwin' or platform_machine != 'x86_64'", "sentence-transformers>=3.0,<6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch_geometric>=2.5", "nltk>=3.8", "neo4j>=5.14", "rdflib>=7.0", "owlrl>=6.0"]
dev = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
nt = "notebook_tutor.cli:main"
notebook-tutor = "notebook_tutor.cli:main"

[project.urls]
Homepage = "https://github.com/charlieabela/notebook-tutor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notebook_tutor = ["static/*", "static/vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# On Linux, PyTorch's default wheels bundle CUDA (several GB). Use the CPU wheels unless you need a GPU.
[tool.uv]
# uv resolves once for every kind of computer; fail here, not on a student's machine, if one of them is left out.
# Intel Macs only up to Python 3.12: PyTorch 2.2, the last built for them, has no wheels for later Pythons
# (the install instructions use Python 3.12).
required-environments = ["sys_platform == 'linux'", "sys_platform == 'win32'",
                         "sys_platform == 'darwin' and platform_machine == 'arm64'",
                         "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_full_version < '3.13'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
